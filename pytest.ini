[pytest]
# Verankert das rootdir im Repo-Root. Ohne diese Datei bestimmt pytest das
# rootdir aus den Argumenten: bei `pytest <repo>/tests/` wird das tests/-
# Verzeichnis zum rootdir, die conftest.py im Root liegt dann ausserhalb von
# confcutdir und wird nie geladen. Die Collection brach dann mit
# ModuleNotFoundError: No module named 'scripts' ab.
testpaths = tests
pythonpath = .
